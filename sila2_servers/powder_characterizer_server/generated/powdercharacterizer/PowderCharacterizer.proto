/* Responses of RunAngleOfRepose */
message RunAngleOfRepose_Responses {
  sila2.org.silastandard.String ResultJson = 1;  /* Final result and artifact metadata. */
}

/* Intermediate responses of RunAngleOfRepose */
message RunAngleOfRepose_IntermediateResponses {
  sila2.org.silastandard.String UpdateJson = 1;  /* Current execution snapshot. */
}

/* Parameters for RunSingleTest */
message RunSingleTest_Parameters {
  sila2.org.silastandard.String Stage = 1;  /* calibration, bulk_density, tapped_density, or angle_of_repose. */
}

/* Responses of RunSingleTest */
message RunSingleTest_Responses {
  sila2.org.silastandard.String ResultJson = 1;  /* Final result and artifact metadata. */
}

/* Intermediate responses of RunSingleTest */
message RunSingleTest_IntermediateResponses {
  sila2.org.silastandard.String UpdateJson = 1;  /* Current execution snapshot. */
}

/* Parameters for RunManualExperiment */
message RunManualExperiment_Parameters {
  sila2.org.silastandard.Integer VibrationLevel = 1;  /* Current manual vibration setting. */
  sila2.org.silastandard.Real VibrationSeconds = 2;  /* Current manual duration. */
  sila2.org.silastandard.Integer DoseCount = 3;  /* Requested chamber count. */
  sila2.org.silastandard.Boolean UseAuger = 4;  /* Whether M3 runs with vibration. */
}

/* Responses of RunManualExperiment */
message RunManualExperiment_Responses {
  sila2.org.silastandard.String ResultJson = 1;  /* Manual operation result. */
}

/* Intermediate responses of RunManualExperiment */
message RunManualExperiment_IntermediateResponses {
  sila2.org.silastandard.String UpdateJson = 1;  /* Current execution snapshot. */
}

/* Parameters for ClearClog */
message ClearClog_Parameters {
}

/* Responses of ClearClog */
message ClearClog_Responses {
  sila2.org.silastandard.String ResultJson = 1;  /* Clog-clear result. */
}

/* Parameters for CaptureCameraPreview */
message CaptureCameraPreview_Parameters {
  sila2.org.silastandard.String FocusMode = 1;  /* Current preview focus mode. */
  sila2.org.silastandard.Real LensPosition = 2;  /* Current manual lens position. */
}

/* Responses of CaptureCameraPreview */
message CaptureCameraPreview_Responses {
  sila2.org.silastandard.Binary ImageData = 1;  /* Unchanged image bytes. */
  sila2.org.silastandard.String MediaType = 2;  /* HTTP media type. */
  sila2.org.silastandard.String Filename = 3;  /* Filename. */
}

/* Parameters for CaptureReposePreview */
message CaptureReposePreview_Parameters {
}

/* Responses of CaptureReposePreview */
message CaptureReposePreview_Responses {
  sila2.org.silastandard.Binary ImageData = 1;  /* PNG bytes. */
  sila2.org.silastandard.String MediaType = 2;  /* HTTP media type. */
  sila2.org.silastandard.String Filename = 3;  /* Filename. */
}

/* Parameters for AbortCurrentOperation */
message AbortCurrentOperation_Parameters {
}

/* Responses of AbortCurrentOperation */
message AbortCurrentOperation_Responses {
}

/* Parameters for SaveResults */
message SaveResults_Parameters {
  sila2.org.silastandard.Boolean UpdateMaterialDatabase = 1;  /* Preserve the existing save-time choice to update Material DB. */
}

/* Responses of SaveResults */
message SaveResults_Responses {
