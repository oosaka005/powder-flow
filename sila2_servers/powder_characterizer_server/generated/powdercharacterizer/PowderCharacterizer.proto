syntax = "proto3";

import "SiLAFramework.proto";

package sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1;

/* Application-level Powder Characterizer operations backed exclusively by first-layer SiLA 2 devices. */
service PowderCharacterizer {
  /* Run the unchanged complete powder-flow workflow. */
  rpc RunAutomatedExperiment (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunAutomatedExperiment_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunAutomatedExperiment */
  rpc RunAutomatedExperiment_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of RunAutomatedExperiment */
  rpc RunAutomatedExperiment_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunAutomatedExperiment_IntermediateResponses) {}
  /* Retrieve result of RunAutomatedExperiment */
  rpc RunAutomatedExperiment_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunAutomatedExperiment_Responses) {}
  /* Run only calibration using current settings. */
  rpc RunCalibration (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunCalibration_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunCalibration */
  rpc RunCalibration_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of RunCalibration */
  rpc RunCalibration_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunCalibration_IntermediateResponses) {}
  /* Retrieve result of RunCalibration */
  rpc RunCalibration_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunCalibration_Responses) {}
  /* Run only bulk density using current settings. */
  rpc RunBulkDensity (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunBulkDensity_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunBulkDensity */
  rpc RunBulkDensity_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of RunBulkDensity */
  rpc RunBulkDensity_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunBulkDensity_IntermediateResponses) {}
  /* Retrieve result of RunBulkDensity */
  rpc RunBulkDensity_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunBulkDensity_Responses) {}
  /* Run only tapped density using current settings. */
  rpc RunTappedDensity (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunTappedDensity_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunTappedDensity */
  rpc RunTappedDensity_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of RunTappedDensity */
  rpc RunTappedDensity_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunTappedDensity_IntermediateResponses) {}
  /* Retrieve result of RunTappedDensity */
  rpc RunTappedDensity_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunTappedDensity_Responses) {}
  /* Run only angle of repose using current settings. */
  rpc RunAngleOfRepose (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunAngleOfRepose_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunAngleOfRepose */
  rpc RunAngleOfRepose_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of RunAngleOfRepose */
  rpc RunAngleOfRepose_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunAngleOfRepose_IntermediateResponses) {}
  /* Retrieve result of RunAngleOfRepose */
  rpc RunAngleOfRepose_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunAngleOfRepose_Responses) {}
  /* Run a named existing single-test stage. */
  rpc RunSingleTest (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunSingleTest_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunSingleTest */
  rpc RunSingleTest_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of RunSingleTest */
  rpc RunSingleTest_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunSingleTest_IntermediateResponses) {}
  /* Retrieve result of RunSingleTest */
  rpc RunSingleTest_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunSingleTest_Responses) {}
  /* Run current Manual Dispense behavior. */
  rpc RunManualExperiment (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunManualExperiment_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunManualExperiment */
  rpc RunManualExperiment_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of RunManualExperiment */
  rpc RunManualExperiment_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunManualExperiment_IntermediateResponses) {}
  /* Retrieve result of RunManualExperiment */
  rpc RunManualExperiment_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.RunManualExperiment_Responses) {}
  /* Run the existing fixed clog-clear operation through the dispenser server. */
  rpc ClearClog (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.ClearClog_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.ClearClog_Responses) {}
  /* Capture a camera preview through the camera server. */
  rpc CaptureCameraPreview (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.CaptureCameraPreview_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.CaptureCameraPreview_Responses) {}
  /* Capture and crop the existing repose preview. */
  rpc CaptureReposePreview (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.CaptureReposePreview_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.CaptureReposePreview_Responses) {}
  /* Cancel the current workflow and propagate StopAll to the first-layer dispenser. */
  rpc AbortCurrentOperation (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.AbortCurrentOperation_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.AbortCurrentOperation_Responses) {}
  /* Save the pending result with the existing result_store format. */
  rpc SaveResults (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.SaveResults_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.SaveResults_Responses) {}
  /* Discard the pending result with the existing result_store behavior. */
  rpc DiscardResults (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.DiscardResults_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.DiscardResults_Responses) {}
  /* Return the unchanged app_settings JSON structure. */
  rpc GetSettings (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.GetSettings_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.GetSettings_Responses) {}
  /* Validate and persist the unchanged app_settings JSON structure. */
  rpc UpdateSettings (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.UpdateSettings_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.UpdateSettings_Responses) {}
  /* Return the existing material database JSON. */
  rpc GetMaterialDatabase (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.GetMaterialDatabase_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.GetMaterialDatabase_Responses) {}
  /* Return a pending or saved run artifact through the second layer. */
  rpc GetArtifact (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.GetArtifact_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.GetArtifact_Responses) {}
  /* JSON snapshot containing state, stage, progress, elapsed time, logs, final result, and error. */
  rpc Get_CurrentRun (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.Get_CurrentRun_Parameters) returns (sila2.com.sekisui.powdercharacterizer.powdercharacterizer.v1.Get_CurrentRun_Responses) {}
}

/* Parameters for RunAutomatedExperiment */
message RunAutomatedExperiment_Parameters {
}

/* Responses of RunAutomatedExperiment */
message RunAutomatedExperiment_Responses {
  sila2.org.silastandard.String ResultJson = 1;  /* Final result and artifact metadata. */
}

/* Intermediate responses of RunAutomatedExperiment */
message RunAutomatedExperiment_IntermediateResponses {
  sila2.org.silastandard.String UpdateJson = 1;  /* Current execution snapshot. */
}

/* Parameters for RunCalibration */
message RunCalibration_Parameters {
}

/* Responses of RunCalibration */
message RunCalibration_Responses {
  sila2.org.silastandard.String ResultJson = 1;  /* Final result and artifact metadata. */
}

/* Intermediate responses of RunCalibration */
message RunCalibration_IntermediateResponses {
  sila2.org.silastandard.String UpdateJson = 1;  /* Current execution snapshot. */
}

/* Parameters for RunBulkDensity */
message RunBulkDensity_Parameters {
